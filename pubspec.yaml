name: todo_management_app
description: A Flutter + Supabase ToDo Management Application.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.5
  supabase_flutter: ^2.10.0
  flutter_dotenv: ^5.2.1
  go_router: ^16.2.1
  url_launcher: ^6.3.1
  intl: ^0.20.2
  uuid: ^4.5.1
  flutter_svg: ^2.2.0
  cached_network_image: ^3.4.1
  shared_preferences: ^2.5.3
  connectivity_plus: ^7.0.0
  logger: ^2.6.1
  flutter_local_notifications: ^22.3.0
  sqflite: ^2.4.3
  flutter_secure_storage: ^11.0.0
  timezone: ^0.11.1
  path: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/images/
