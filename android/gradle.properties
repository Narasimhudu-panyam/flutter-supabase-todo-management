# Keep the Gradle daemon within the available RAM on this 8 GB development
# machine.  Larger values (such as the previous 8 GB setting) leave no native
# memory for R8, Kotlin, and the Android build tools.
org.gradle.jvmargs=-Xmx2048M -XX:MaxMetaspaceSize=512M -Dfile.encoding=UTF-8
# Run the Kotlin compiler out of process with a bounded heap.
kotlin.daemon.jvm.options=-Xmx1024M

android.useAndroidX=true

# Retained for compatibility with Flutter 3.44.8's Android template and the
# current Flutter plugin ecosystem. Remove these only after Flutter's template
# and every transitive Android plugin have migrated to AGP built-in Kotlin.
android.newDsl=false
android.builtInKotlin=false

# Use Gradle's supported defaults. The removed Kotlin classpath-snapshot
# property is obsolete in Kotlin 2.3, which already uses ABI snapshots.
org.gradle.caching=true
org.gradle.parallel=false
org.gradle.daemon=true
org.gradle.configureondemand=false
kotlin.incremental=false
kotlin.daemon.enabled=false
