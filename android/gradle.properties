# Keep Gradle below the memory required by Flutter's Dart kernel compiler.
# This workstation currently has very little free RAM/pagefile headroom.
org.gradle.jvmargs=-Xmx768M -XX:MaxMetaspaceSize=256M -Dfile.encoding=UTF-8
# Kotlin is run in-process below, but retain a conservative bound if Gradle
# starts a separate Kotlin daemon.
kotlin.daemon.jvm.options=-Xmx512M

android.useAndroidX=true

# Retained for compatibility with Flutter 3.44.8's Android template and the
# current Flutter plugin ecosystem. Remove these only after Flutter's template
# and every transitive Android plugin have migrated to AGP built-in Kotlin.
android.newDsl=false
android.builtInKotlin=false

# Use Gradle's supported defaults. The removed Kotlin classpath-snapshot
# property is obsolete in Kotlin 2.3, which already uses ABI snapshots.
org.gradle.caching=true
org.gradle.parallel=false
org.gradle.daemon=false
org.gradle.configureondemand=false
kotlin.incremental=false
kotlin.daemon.enabled=false
